name: pr-checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Check changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Release Please generates CHANGELOG.md from conventional commits, so a
      # pull request earns its changelog entry by using them, not by editing
      # the generated file.
      - name: Require conventional commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          SKIP_LABEL: no changelog
        run: |
          if jq --exit-status --arg label "$SKIP_LABEL" \
            'any(.pull_request.labels[]?; .name == $label)' \
            "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "Changelog check skipped by label: $SKIP_LABEL"
            exit 0
          fi

          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+'

          status=0
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::Pull request title is not a conventional commit: $PR_TITLE"
            status=1
          fi

          base_sha=$(jq --raw-output '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
          head_sha=$(jq --raw-output '.pull_request.head.sha' "$GITHUB_EVENT_PATH")

          for commit in "$base_sha" "$head_sha"; do
            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$commit"
            fi
          done

          while IFS=$'\t' read -r sha subject; do
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Commit ${sha:0:8} is not a conventional commit: $subject"
              status=1
            fi
          done < <(git log --no-merges --format='%H%x09%s' "$base_sha..$head_sha")

          if [[ "$status" != "0" ]]; then
            echo "::error::Release Please builds CHANGELOG.md from conventional commits; fix the subjects above or apply the '$SKIP_LABEL' label"
          fi
          exit "$status"
